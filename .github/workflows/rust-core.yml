name: Rust native libraries (reusable)

# Builds the arm64 artefacts the app's APK needs, once, for whichever workflow
# calls it.
#
# This is a reusable workflow rather than a job in `ci.yml` for one concrete
# reason: **`ci.yml` runs on `push: branches: [main]`, so a tag push never
# builds anything.** The cross-compile job used to live there, which meant that at
# the moment `release.yml` started there was no Rust artefact to download and the
# release could not contain the core at all. `debug-apk.yml` had the same gap.
# All three call this instead, so "the core is in the APK" is a property of the
# build rather than of which event happened to run last.
#
# The alternative — building the cdylib inside the Gradle build — was rejected for
# putting a rustup and cargo-ndk install into the slowest job in the repo, and for
# making the APK depend on a toolchain the Flutter build has no other reason to
# need.
#
# Callers get the artefacts through the run's artifact store, not through a shared
# filesystem: a called workflow's jobs get their own runners, so the only channels
# between them are `outputs` and artifacts.

on:
  workflow_call:
    outputs:
      cdylib:
        description: 'Path of the built cdylib, relative to the workspace root'
        value: ${{ jobs.build.outputs.cdylib }}
      runtime:
        description: 'Path of the fetched LiteRT-LM C API runtime'
        value: ${{ jobs.build.outputs.runtime }}
    inputs:
      upload-bench:
        description: >
          Also build `mobilelm-bench` and ship it as `mobilelm-bench-arm64`, the
          headless probe the device runs use. Only the CI workflow needs it; a
          release does not, and building it costs a link of every engine symbol
          into a second binary.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: arm64 native
    runs-on: ubuntu-latest
    outputs:
      cdylib: ${{ steps.locate.outputs.path }}
      runtime: ${{ steps.runtime.outputs.path }}
    # Visible to the cache key and to the fetch script. A step's own `with:` cannot
    # read that step's `env:`, so these have to be job level — see the cache step.
    env:
      LITERTLM_TAG: v0.16.0
      LITERT_C_API_VERSION: '0.1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Use an NDK the runner image already ships. `nttld/setup-ndk` 404s on it
      # (28.2.13676358 ships as android-ndk-r28c-linux.zip) and `sdkmanager` is
      # not on PATH, so neither is an option. The image ships two NDKs and
      # exports ANDROID_NDK_ROOT for one of them -- a bare glob can pick the other
      # and leave cargo-ndk warning that the two variables disagree, so trust the
      # exported one and set both names from that single value.
      #
      # The version is whatever the image pins, NOT the 28.2.13676358 that
      # `flutter.ndkVersion` resolves to. For the headless probe that cannot
      # change behaviour, because it links no engine. It stops being true the
      # moment something *is* linked into the artefact that ships -- which is now
      # the case, so this is the note to revisit rather than a settled question.
      - name: Locate the NDK
        run: |
          if [ -n "${ANDROID_NDK_ROOT:-}" ] && [ -d "${ANDROID_NDK_ROOT}" ]; then
            ndk="$ANDROID_NDK_ROOT"
          else
            ndk="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$ndk" ]; then
            echo "::error::no NDK found (ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-unset})" >&2
            exit 1
          fi
          echo "using $ndk"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
          } >> "$GITHUB_ENV"

      # The zip is 154 MB and only 39 MB of it ends up in the APK, because it
      # carries macOS and iOS builds this app will never run. Caching the download
      # matters more than it looks: without it every debug build on every push pays
      # for those 115 MB. Keyed on the version, so bumping LITERTLM_TAG is a cache
      # miss rather than a silently stale runtime -- the restore-keys prefix is on
      # the tag alone so a version bump still finds the older blob and the fetch
      # script's own "already present" check does the rest.
      #
      # The tags live at job level, not step level: a step's own `with:` cannot see
      # its own `env:`, and referencing an empty string there would produce the key
      # `litert-capi--`, which caches nothing and looks like it works.
      - uses: actions/cache@v4
        with:
          path: local_plugins/mobilelm_core/vendor/prebuilt
          key: litert-capi-${{ env.LITERTLM_TAG }}-${{ env.LITERT_C_API_VERSION }}
          restore-keys: |
            litert-capi-${{ env.LITERTLM_TAG }}-

      - name: Fetch the LiteRT-LM C API runtime
        id: runtime
        working-directory: local_plugins/mobilelm_core
        env:
          LITERTLM_TAG: ${{ env.LITERTLM_TAG }}
          LITERT_C_API_VERSION: ${{ env.LITERT_C_API_VERSION }}
        run: |
          # The script is the only thing that knows how to tell a usable artefact
          # from a 404: it checks the ELF machine and counts `litert_lm_*` exports
          # before anything tries to dlopen it on a phone. A wrong version here
          # wastes a CI cycle and a device trip.
          scripts/fetch-litert-capi.sh
          so=vendor/prebuilt/litert-lm/lib/android_arm64/liblitert-lm.so
          [ -f "$so" ] || { echo "::error::$so missing after fetch" >&2; exit 1; }
          echo "$(du -h "$so" | cut -f1), $(nm -D --defined-only "$so" | grep -c ' T litert_lm_') litert_lm_* exports"
          echo "path=local_plugins/mobilelm_core/$so" >> "$GITHUB_OUTPUT"

      - name: Cross-compile the cdylib
        working-directory: local_plugins/mobilelm_core
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a build --release -p mobilelm-ffi

      # Do not hardcode the output path. cargo-ndk's layout is not stable across
      # versions, and `file` on a missing path exits 0 on this image -- so a wrong
      # guess renders as a green step followed by a missing artefact, which is
      # exactly what happened once already. Find the binary, then prove it is
      # there, and prove it is the right architecture while we are looking.
      - name: Locate the cdylib
        id: locate
        working-directory: local_plugins/mobilelm_core
        run: |
          so="$(find target -type f -name 'libmobilelm_core.so' | head -1)"
          if [ -z "$so" ]; then
            echo "::error::no libmobilelm_core.so produced under target/" >&2
            find target -name 'libmobilelm_core*' >&2 || true
            exit 1
          fi
          file "$so"
          if ! readelf -h "$so" | grep -qiE 'aarch64|ARM64'; then
            echo "::error::$so is not aarch64" >&2
            exit 1
          fi
          echo "size=$(du -h "$so" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "path=local_plugins/mobilelm_core/$so" >> "$GITHUB_OUTPUT"

      # The engine must not have become a link-time dependency of the library the
      # APK ships. dlopen is the whole reason `cargo test` runs on a laptop, and
      # why an app can report a missing runtime instead of dying at startup. A
      # stray `#[link]` in mobilelm-ffi would take that away while every test in
      # the workspace still passed.
      #
      # readelf, not ldd: ldd *executes* the binary's interpreter, and on this
      # x86-64 host that is the x86-64 loader pointed at an aarch64 Android
      # binary. It exits 1 with no output, which looks exactly like a finding.
      # DT_NEEDED is a table read and does not care what the target is.
      - name: The engine is loaded, not linked
        env:
          CDYLIB: ${{ steps.locate.outputs.path }}
        run: |
          needed="$(readelf -d "$CDYLIB" | grep NEEDED)"
          echo "$needed"
          if echo "$needed" | grep -qi litert; then
            echo "::error::libmobilelm_core.so links liblitert-lm; it must dlopen it" >&2
            exit 1
          fi
          echo "ok: no litert in DT_NEEDED"

      # The Dart side hardcodes this name in `DynamicLibrary.open`, and a mismatch
      # is a crash at first use with a message that does not mention names. Assert
      # the exports are present rather than trusting the build to have kept them.
      - name: The ABI the Dart bindings expect is exported
        env:
          CDYLIB: ${{ steps.locate.outputs.path }}
        run: |
          for sym in mobilelm_abi_version mobilelm_engine_create mobilelm_engine_free \
                      mobilelm_conversation_open mobilelm_send_stream mobilelm_send_text \
                      mobilelm_count_tokens mobilelm_benchmark mobilelm_probe mobilelm_plan \
                      mobilelm_symbols_missing mobilelm_last_error mobilelm_string_free \
                      mobilelm_engine_load_report; do
            if ! nm -D --defined-only "$CDYLIB" | grep -q " T $sym\$"; then
              echo "::error::$sym is not exported; the Dart bindings would fail at first call" >&2
              exit 1
            fi
          done
          echo "ok: all 14 ABI entry points exported"

      - name: Cross-compile the headless probe
        if: ${{ inputs.upload-bench }}
        working-directory: local_plugins/mobilelm_core
        run: |
          cargo ndk -t arm64-v8a build --release -p mobilelm-bench
          bin="$(find target -type f -name mobilelm-bench -perm -u+x | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::no mobilelm-bench produced under target/" >&2
            find target -name 'mobilelm-bench*' >&2 || true
            exit 1
          fi
          file "$bin"
          if readelf -d "$bin" | grep NEEDED | grep -qi litert; then
            echo "::error::mobilelm-bench links liblitert-lm; it must dlopen it" >&2
            exit 1
          fi
          echo "path=local_plugins/mobilelm_core/$bin" >> "$GITHUB_OUTPUT"

      # A run on the phone needs the binary, the runtime and a model. The model
      # is 586 MB and stays out of the artifact; the instructions that explain
      # which model, and where, are docs/ARTIFACT.md -- versioned prose rather
      # than a heredoc inside a YAML block scalar, which cannot be indented.
      - name: Stage the device bundle
        if: ${{ inputs.upload-bench }}
        run: |
          core=local_plugins/mobilelm_core
          mkdir -p "$core/dist"
          cp "${{ steps.locate.outputs.path }}" "$core/dist/libmobilelm_core.so"
          cp "${{ steps.runtime.outputs.path }}" "$core/dist/liblitert-lm.so"
          cp "$core/scripts/run-on-device.sh" "$core/dist/"
          cp "$core/docs/ARTIFACT.md" "$core/dist/README.md"
          ls -lh "$core/dist/"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload-bench }}
        with:
          name: mobilelm-bench-arm64
          path: local_plugins/mobilelm_core/dist/
          if-no-files-found: error

      # The two files the APK needs, uploaded on every call regardless of the
      # input. A single artifact with a fixed layout, so the caller's Gradle
      # snippet is three lines of `cp` and cannot be subtly different per
      # workflow.
      - name: Stage the APK natives
        run: |
          out="$RUNNER_TEMP/mobilelm-native"
          mkdir -p "$out"
          cp "${{ steps.locate.outputs.path }}" "$out/libmobilelm_core.so"
          cp "${{ steps.runtime.outputs.path }}" "$out/liblitert-lm.so"
          ls -lh "$out/"

      - uses: actions/upload-artifact@v4
        with:
          name: mobilelm-native-arm64
          path: ${{ runner.temp }}/mobilelm-native/
          if-no-files-found: error
          retention-days: 7
