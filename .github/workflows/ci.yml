name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Codebase has ~40 pre-existing lint infos/warnings; only errors gate CI.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

  # The Rust engine core (local_plugins/mobilelm_core). Separate from `analyze`
  # because it is a different toolchain: a Dart lint failure and a missing
  # aarch64 std have nothing to do with each other, and lumping them in hides
  # which of the two is broken.
  rust-core:
    name: Rust core, host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Test and lint
        working-directory: local_plugins/mobilelm_core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Proves the core still cross-compiles for the phone, and that the engine
  # stayed a runtime dependency. Neither is checked by the host job above, and
  # both fail in ways that only a real target shows.
  #
  # It does NOT run the engine. qemu-user cannot execute an Android binary --
  # it emulates the CPU, not libc, and the binary hardcodes /system/bin/linker64
  # -- so a generation run belongs on the phone. See
  # local_plugins/mobilelm_core/docs/ARTIFACT.md.
  # The arm64 build is a reusable workflow, not a job here, because a tag push
  # never runs this file: `on: push: branches: [main]`. While the cross-compile
  # lived here, `release.yml` had no Rust artefact to download and could not
  # contain the core at all, and `debug-apk.yml` could not either. All three
  # workflows call `.github/workflows/rust-core.yml` instead.
  #
  # `upload-bench: true` is specific to this one. The headless probe is what the
  # device runs use, and a release has no use for it.
  rust-core-android:
    name: Rust core, arm64
    uses: ./.github/workflows/rust-core.yml
    with:
      upload-bench: true
