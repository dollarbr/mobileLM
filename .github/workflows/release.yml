name: Android Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  # The Rust core's arm64 build. It is a separate job and a reusable workflow for
  # one concrete reason: `ci.yml` runs on `push: branches: [main]`, so **a tag
  # push never built anything.** While the cross-compile lived there, this file
  # had no Rust artefact to download and could not have shipped the core at all —
  # the gap was invisible precisely because the job was green in ci.yml and
  # nobody runs ci.yml when they cut a tag.
  #
  # Note what this job does NOT have: `environment: release`. The signing secrets
  # are not needed to compile a cdylib, and a job that could read them should not
  # also be a job that does not need them. The environment stays on the job that
  # actually signs.
  native:
    name: Rust core, arm64
    uses: ./.github/workflows/rust-core.yml

  build:
    name: Build & Publish
    needs: native
    runs-on: ubuntu-latest

    # The three RELEASE_* secrets live in the `release` environment, not at
    # repository level. Two things follow from this, and both are the point:
    #
    # - Only a job that declares `environment: release` can read them. At
    #   repository level they were visible to *every* workflow in the repo,
    #   including debug-apk.yml, which runs on every single push.
    # - The environment has a custom branch policy allowing tags only, so a
    #   workflow run from a branch cannot deploy to it. Pushing to main, or
    #   opening a branch, does not get anybody near the signing key.
    #
    # Combined with the certificate fingerprint asserted after the build, the
    # path from "someone pushed code" to "a release got signed" now requires a
    # tag and produces a key that is checked against a known-good value.
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # release notes diff against the previous tag

      # `android/app/src/main/jniLibs/arm64-v8a/` is already where this app keeps a
      # hand-placed `.so` that ships in the APK — `libomp.so` lives there and is
      # committed — so no Gradle change is needed. Both of these are gitignored by
      # name: ~42 MB has no business in git, and the core's rule is that no binary
      # is committed.
      - name: Put the Rust core and the LiteRT runtime in jniLibs
        uses: actions/download-artifact@v4
        with:
          name: mobilelm-native-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Confirm the natives landed
        run: |
          dir=android/app/src/main/jniLibs/arm64-v8a
          ls -lh "$dir"
          for so in libmobilelm_core.so liblitert-lm.so; do
            if [ ! -f "$dir/$so" ]; then
              echo "::error::$so missing from jniLibs; the APK would have no engine" >&2
              exit 1
            fi
          done

      - name: Check tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pubspec=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -1)
          if [ "$pubspec" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec version $pubspec"
            exit 1
          fi
          echo "Version $TAG"

      # Same reason as debug-apk.yml: the vendored native builds (llama.cpp
      # Vulkan and its ~300 shader objects, LiteRT, SD) fill the runner's
      # ~14 GB of free disk with intermediates, and a release build adds R8 on
      # top. Without this the job dies on "No space left on device".
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/share/miniconda 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Materialise the release keystore from the secrets, and write the
      # key.properties that build.gradle.kts reads.
      #
      # This step did not exist. The three RELEASE_* secrets were configured on
      # the repository and never referenced by any workflow, while the build ran
      # with MOBILELM_ALLOW_DEBUG_RELEASE_SIGNING=true and fell back to the
      # debug signing config. Every published APK was debug-signed, which is to
      # say forgeable: the debug key is public, so anyone could ship an update
      # over a user's install. The keystore itself was fine the whole time —
      # nobody was reading it.
      #
      # The alias is discovered from the keystore rather than taken from a fourth
      # secret. A secret that has to be kept in sync with a file is a secret that
      # will drift, and a wrong alias surfaces as "keystore password was
      # incorrect", which is indistinguishable from a wrong password.
      - name: Materialise the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          for pair in "KEYSTORE_B64:RELEASE_KEYSTORE_BASE64" \
                      "STORE_PASSWORD:RELEASE_STORE_PASSWORD" \
                      "KEY_PASSWORD:RELEASE_KEY_PASSWORD"; do
            var="${pair%%:*}"; name="${pair##*:}"
            if [ -z "${!var}" ]; then
              echo "::error::$name is empty or unset. Refusing to publish a debug-signed APK." >&2
              exit 1
            fi
          done

          # A secret set from a file or a paste keeps its trailing newline, and
          # GitHub does not strip it. `keytool -storepass $'secret\n'` then fails
          # with "keystore password was incorrect" -- the same message a wrong
          # password gives, for a password that is not wrong. Strip surrounding
          # whitespace; a real PKCS12 password with a newline in it is not a
          # thing anyone has, and stripping cannot make a correct one fail.
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"

          mkdir -p android
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore.jks
          test -s android/keystore.jks || {
            echo "::error::keystore.jks decoded to nothing" >&2; exit 1; }

          # Report the size. "keystore password was incorrect" cannot tell you
          # whether the secret holds the wrong keystore or the wrong password,
          # and those need different fixes. A PKCS12 file is salted, so the bytes
          # differ run to run even for the same key -- but the size does not.
          # The reference keystore is 2780 bytes; a mismatch here means the
          # base64 secret is a different file, not a different password.
          echo "decoded keystore: $(stat -c %s android/keystore.jks) bytes"

          # Alias discovery, locale-independently.
          #
          # `keytool -list -v` is translated: on a pt_BR JDK it prints
          # "Nome do alias:", not "Alias name:", so the obvious sed matches
          # nothing and the step fails with "found 0 aliases" — or worse, on a
          # differently-localised runner, a plausible wrong answer. LC_ALL=C
          # alone would fix that and is why it is set, but the parse below does
          # not depend on it: in the *non-verbose* listing the entry line is
          # `alias, <date>, PrivateKeyEntry,` and neither the alias nor the
          # entry type is translated. Both together is belt and braces.
          aliases=$(
            LC_ALL=C keytool -list -keystore android/keystore.jks \
              -storepass "$STORE_PASSWORD" 2>/dev/null \
            | grep -E '(PrivateKeyEntry|trustedCertEntry)' \
            | sed 's/,.*//' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          )
          count=$(printf '%s\n' "$aliases" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alias in the keystore, found $count" >&2
            printf '%s\n' "$aliases" | sed 's/^/  /' >&2
            LC_ALL=C keytool -list -keystore android/keystore.jks \
              -storepass "$STORE_PASSWORD" 2>&1 | sed 's/^/  | /' >&2 || true
            exit 1
          fi
          alias=$(printf '%s\n' "$aliases" | head -1)
          echo "keystore has a single alias: $alias"

          # storeFile is read with file() from the app module (android/app), so
          # an absolute path is the only spelling that cannot be misread as
          # relative to the wrong directory.
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$alias
          keyPassword=$KEY_PASSWORD
          EOF

          # Prove the credentials work now, rather than letting Gradle fail 20
          # minutes into a native build with "password was incorrect".
          keytool -list -keystore android/keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$alias" >/dev/null

          # Both files are gitignored, but say so where the next person looks.
          git check-ignore -q android/key.properties \
            || { echo "::error::android/key.properties is NOT gitignored" >&2; exit 1; }
          git check-ignore -q android/keystore.jks \
            || { echo "::error::android/keystore.jks is NOT gitignored" >&2; exit 1; }
          echo "ok: keystore materialised, credentials verified, both paths ignored"

      # One build with --split-per-abi, not two builds. Without that flag a
      # single --target-platform emits plain app-release.apk, so the second
      # build silently overwrote the first and no per-ABI file ever existed.
      - name: Build APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=utf-8 -Dkotlin.daemon.jvm.options=-Xmx4g"
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64

      - name: Name APKs after the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd build/app/outputs/flutter-apk
          ls -1 # surfaces a naming mismatch here rather than in the mv below
          mv app-arm64-v8a-release.apk  "mobilelm-$TAG-arm64-v8a.apk"
          ls -lh mobilelm-*.apk

      # Assert the natives are in the APK, from the APK. The step that checks
      # jniLibs proves the files were downloaded; this proves they were packaged,
      # which is a different thing — a `packagingOptions` exclusion or an ABI
      # filter would pass the first and fail this.
      #
      # Also asserted: that `liblitertlm_jni.so` is GONE. That is the evidence
      # 0.4.0's claim rests on. The Kotlin plugin and its AAR are deleted in the
      # commit that switches the app over; until both happen this is the check
      # that says so, and it is here rather than in a comment because "the Kotlin
      # plugin is gone" is exactly the kind of claim that drifts.
      - name: The APK carries the Rust core, not the Kotlin plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          apk="build/app/outputs/flutter-apk/mobilelm-$TAG-arm64-v8a.apk"
          test -f "$apk" || { echo "::error::no APK at $apk" >&2; exit 1; }

          for so in libmobilelm_core.so liblitert-lm.so; do
            if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/$so"; then
              echo "::error::$so is not in the APK" >&2
              unzip -l "$apk" | grep 'lib/arm64-v8a/' >&2 || true
              exit 1
            fi
          done

          if [ "${REQUIRE_NO_KOTLIN_PLUGIN:-0}" = "1" ]; then
            if unzip -l "$apk" | grep -q 'lib/arm64-v8a/liblitertlm_jni.so'; then
              echo "::error::liblitertlm_jni.so is still in the APK; the Kotlin plugin was not removed" >&2
              exit 1
            fi
            echo "ok: the Kotlin plugin's runtime is gone, as 0.4.0 claims"
          else
            if unzip -l "$apk" | grep -q 'lib/arm64-v8a/liblitertlm_jni.so'; then
              echo "note: liblitertlm_jni.so is still present — both engines are shipped."
              echo "      Expected before the Kotlin plugin is deleted; set"
              echo "      REQUIRE_NO_KOTLIN_PLUGIN=1 in the repository variable once it is not."
            else
              echo "ok: liblitertlm_jni.so is absent"
            fi
          fi

          unzip -l "$apk" | grep 'lib/arm64-v8a/' | awk '{printf "  %-46s %s\n", $4, $1}'

      # The assertion that would have caught this in the first place, and the one
      # that keeps it caught. It is cheap, it is the actual property that
      # matters, and it fails on the thing rather than on a proxy for it.
      - name: The APK is signed with the release key
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # apksigner is not on PATH on the runner image; it lives in a
          # build-tools directory. Take the newest one rather than a hardcoded
          # revision, which ages out with the image.
          apksigner="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null \
            | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "::error::no apksigner under build-tools; cannot verify signing" >&2
            exit 1
          fi
          echo "using $apksigner"

          apk="build/app/outputs/flutter-apk/mobilelm-$TAG-arm64-v8a.apk"
          test -f "$apk" || { echo "::error::no APK at $apk" >&2; exit 1; }

          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -E "certificate DN|SHA-256 digest"

          # The certificate itself, not merely "not the debug key".
          #
          # Rejecting CN=Android Debug and requiring a single signer is not
          # enough. Both checks pass happily for a *fresh* release key, which is
          # the shape the original bug had: a release that builds, signs and
          # goes green while being signed by the wrong key. The only thing that
          # separates "our key" from "some other non-debug key" is the
          # fingerprint, so that is what gets compared.
          #
          # This is what turns "every release from 0.3.4 on is signed by the same
          # key" from something to be remembered into something the build
          # enforces. Rotating the key on purpose means changing this line in the
          # same commit that changes the secret, which is the correct friction.
          EXPECTED_CERT=1cd43cb7daddcec2a70c35926939a00247c66df5b1bd0a08db4293fc556cfb6d
          actual_cert=$(echo "$certs" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          if [ "$actual_cert" != "$EXPECTED_CERT" ]; then
            echo "::error::$apk is not signed with the project key." >&2
            echo "::error::expected $EXPECTED_CERT" >&2
            echo "::error::actual   ${actual_cert:-<none>}" >&2
            echo "::error::If you rotated the key deliberately, update EXPECTED_CERT." >&2
            exit 1
          fi

          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::$apk is signed with the Android debug key. Do not publish it." >&2
            exit 1
          fi
          # One signer. A second entry would mean either a v1/v2/v3 scheme
          # difference being reported separately, or a genuine second key, and
          # neither should pass silently.
          signers=$(echo "$certs" | grep -c "certificate DN" || true)
          if [ "$signers" -ne 1 ]; then
            echo "::error::expected 1 signer, found $signers" >&2
            exit 1
          fi
          echo "ok: project key, single non-debug signer"

      - name: Generate release notes from commits
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          echo "Comparing ${prev:-start of history} .. $TAG"

          # Conventional-commit prefixes bucketed explicitly. Anything matching
          # none of them lands in "Other" — no commit is silently dropped.
          known='^(feat|fix|ci|build|chore|docs|refactor|perf|style|test)(\([^)]*\))?!?:'

          log() { git log --no-merges --pretty='%s%x09%h' "$range"; }
          fmt() {
            sed -E 's/^[a-z]+(\([^)]*\))?!?: *//' \
              | awk -F'\t' '{printf "- %s (%s)\n", $1, $2}'
          }
          section() { # $1 = heading, $2 = pre-formatted bullets
            if [ -n "$2" ]; then printf '### %s\n%s\n\n' "$1" "$2"; fi
          }

          {
            printf '## mobileLM %s\n\n' "$TAG"
            section 'Features'    "$(log | grep -E '^feat(\([^)]*\))?!?:' | fmt)"
            section 'Fixes'       "$(log | grep -E '^fix(\([^)]*\))?!?:' | fmt)"
            section 'Build & CI'  "$(log | grep -E '^(ci|build|chore)(\([^)]*\))?!?:' | fmt)"
            section 'Maintenance' "$(log | grep -E '^(docs|refactor|perf|style|test)(\([^)]*\))?!?:' | fmt)"
            section 'Other'       "$(log | grep -Ev "$known" | fmt)"

            printf '### Downloads\n'
            printf -- '- `arm64-v8a` — most phones from 2017 onward\n\n'

            if [ -n "$prev" ]; then
              printf '**Full diff:** %s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            build/app/outputs/flutter-apk/mobilelm-*.apk
