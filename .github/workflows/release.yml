name: Android Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # release notes diff against the previous tag

      - name: Check tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Remove leading 'v' if present
          TAG_VERSION="${TAG#v}"
          pubspec=$(grep "^version:" pubspec.yaml | sed -e "s/version://" -e "s/[[:space:]]//g" -e "s/+.*//")
          if [ "$pubspec" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match pubspec version $pubspec (expected $TAG_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/share/miniconda 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode and import release keystore
        run: |
          mkdir -p android/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/keystore/mobilelm_release.jks
          chmod 600 android/keystore/mobilelm_release.jks
          echo "storeFile=android/keystore/mobilelm_release.jks" > android/key.properties
          echo "storePassword=$RELEASE_STORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$RELEASE_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=mobilelm_release" >> android/key.properties
          chmod 600 android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Verify CI environment for release signing
        run: |
          echo "Checking CI environment..."
          if [ -z "$GITHUB_ACTIONS" ] && [ -z "$CI" ]; then
            echo "Error: Release signing is only allowed in CI environments."
            echo "For local testing, use: flutter build apk --debug"
            exit 1
          fi
          echo "CI environment verified: GITHUB_ACTIONS=$GITHUB_ACTIONS, CI=$CI"

      - name: Build APKs
        env:
          MOBILELM_ALLOW_DEBUG_RELEASE_SIGNING: "true"
          GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=utf-8 -Dkotlin.daemon.jvm.options=-Xmx4g"
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64

      - name: Name APKs after the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd build/app/outputs/flutter-apk
          ls -1 # surfaces a naming mismatch here rather than in the mv below
          mv app-arm64-v8a-release.apk  "mobilelm-$TAG-arm64-v8a.apk"
          ls -lh mobilelm-*.apk

      - name: Generate release notes from commits
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          echo "Comparing ${prev:-start of history} .. $TAG"

          # Conventional-commit prefixes bucketed explicitly. Anything matching
          # none of them lands in "Other" — no commit is silently dropped.
          known='^(feat|fix|ci|build|chore|docs|refactor|perf|style|test)(\([^)]*\))?!?:'

          log() { git log --no-merges --pretty='%s%x09%h' "$range"; }
          fmt() {
            sed -E 's/^[a-z]+(\([^)]*\))?!?: *//' \
              | awk -F'\t' '{printf "- %s (%s)\n", $1, $2}'
          }
          section() { # $1 = heading, $2 = pre-formatted bullets
            if [ -n "$2" ]; then printf '### %s\n%s\n\n' "$1" "$2"; fi
          }

          {
            printf '## mobileLM %s\n\n' "$TAG"
            section 'Features'    "$(log | grep -E '^feat(\([^)]*\))?!?:' | fmt)"
            section 'Fixes'       "$(log | grep -E '^fix(\([^)]*\))?!?:' | fmt)"
            section 'Build & CI'  "$(log | grep -E '^(ci|build|chore)(\([^)]*\))?!?:' | fmt)"
            section 'Maintenance' "$(log | grep -E '^(docs|refactor|perf|style|test)(\([^)]*\))?!?:' | fmt)"
            section 'Other'       "$(log | grep -Ev "$known" | fmt)"

            printf '### Downloads\n'
            printf -- '- `arm64-v8a` — most phones from 2017 onward\n\n'

            if [ -n "$prev" ]; then
              printf '**Full diff:** %s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            build/app/outputs/flutter-apk/mobilelm-*.apk
