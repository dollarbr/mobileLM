name: litert_flutter
description: >-
  LiteRT (formerly TensorFlow Lite) runtime for Flutter — load, inspect and run
  `.tflite` models on-device with CPU, OpenCL GPU or NPU acceleration. This is
  the TFLite interpreter; the LiteRT-LM generative runtime is a separate plugin.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dollarbr.litert_flutter
        pluginClass: LiteRtPlugin
