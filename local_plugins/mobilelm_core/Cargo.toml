[workspace]
resolver = "2"
members = [
    "crates/mobilelm-core",
    "crates/mobilelm-litert",
    "crates/mobilelm-ffi",
    "crates/mobilelm-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
