[package]
name = "mobilelm-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI over the engine core, for dart:ffi. This is the crate the APK loads."

[lib]
# The `.so` the APK ships and `DynamicLibrary.open('libmobilelm_core.so')`
# finds. Named for the project rather than the package (`mobilelm-ffi`), because
# Dart has to hardcode this string and one name is easier to keep right than two.
name = "mobilelm_core"
#
# **cdylib only, no rlib.** With an rlib this package would emit
# `libmobilelm_core.rlib` into the same target/ directory as the `mobilelm-core`
# package's library, and the two would overwrite each other — a failure that shows
# up as an unrelated crate failing to link depending on build order. Nothing links
# this crate as a Rust dependency: the only consumer is `dart:ffi` loading the
# shared object, and the logic worth testing lives one crate down.
crate-type = ["cdylib"]
# For the same reason: doctests link the rlib, which does not exist.
doctest = false

[dependencies]
mobilelm-core = { path = "../mobilelm-core" }
mobilelm-litert = { path = "../mobilelm-litert" }
